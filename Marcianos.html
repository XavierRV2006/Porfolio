<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Marcianitos - Juego</title>
<style>
    html,body {height:100%; margin:0; background:#000; display:flex; align-items:center; justify-content:center;}
    canvas { image-rendering: pixelated; border: 4px solid #222; background:#001; display:block; }
    #hud { position: absolute; top:8px; left:8px; color:#0f0; font-family: monospace; }
    /* Overlay para mensaje y botón de reinicio */
    #overlay { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    #overlayBox {
        background: rgba(0,0,0,0.85);
        color: #0f0;
        padding: 18px 22px;
        border: 3px solid #222;
        font-family: monospace;
        text-align: center;
        pointer-events:auto;
        display:none;
    }
    #overlayBox h2 { margin: 0 0 12px 0; font-size: 20px; }
    #restartBtn {
        background:#111; color:#0f0; border:2px solid #0f0; padding:8px 12px; cursor:pointer; font-family:monospace;
    }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>

<!-- Overlay con mensaje y botón de reinicio -->
<div id="overlay">
    <div id="overlayBox">
        <h2 id="overlayTitle"></h2>
        <div><button id="restartBtn">Volver a empezar</button></div>
    </div>
</div>

<script>
/*
    Marcianitos en canvas con sprites pixelados.
    - Nave y marcianos dibujados por matrices de píxeles.
    - Cadencia de disparo de la nave: 1 segundo.
    - Animación de marcianitos: 2 frames.
*/

const logicalW = 160, logicalH = 120;
const scale = 4;
const canvas = document.getElementById('screen');
canvas.width = logicalW * scale;
canvas.height = logicalH * scale;
canvas.style.width = (logicalW*scale) + 'px';
canvas.style.height = (logicalH*scale) + 'px';
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Offscreen logical canvas
const lCanvas = document.createElement('canvas');
lCanvas.width = logicalW; lCanvas.height = logicalH;
const L = lCanvas.getContext('2d');

const hud = document.getElementById('hud');
const overlayBox = document.getElementById('overlayBox');
const overlayTitle = document.getElementById('overlayTitle');
const restartBtn = document.getElementById('restartBtn');

let keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Pixel sprites as arrays of strings (' ' = empty, other chars map to colors)
const COLORS = {
    'r': '#ff0044',
    'w': '#fff',
    'g': '#8cff66',
    'y': '#ffd166',
    'b': '#66c2ff',
    'o': '#ff9f1c'
};

const shipSprite = [
    "   w   ",
    "  www  ",
    " wwwww ",
    "wwwwwww",
    " wwwww ",
    "  www   "
];

const alienFrames = [
    [
        "  gg  ",
        " gggg ",
        "gggggg",
        " gggg ",
        "g g g "
    ],
    [
        "  gg  ",
        " gggg ",
        "gggggg",
        "g ggg ",
        " g g  "
    ]
];

function drawPixelSprite(ctx, sprite, tx, ty, pixelSize=1, colorMap={'g':'g','w':'w'}) {
    for (let y=0;y<sprite.length;y++){
        const row = sprite[y];
        for (let x=0;x<row.length;x++){
            const c = row[x];
            if (c === ' ') continue;
            const col = COLORS[c] || '#fff';
            ctx.fillStyle = col;
            ctx.fillRect(tx + x*pixelSize, ty + y*pixelSize, pixelSize, pixelSize);
        }
    }
}

// Game state
let player = {
    x: logicalW/2 - 3,
    y: logicalH - 12,
    w: shipSprite[0].length,
    h: shipSprite.length,
    speed: 60, // pixels per second
    lastShot: -9999
};

let bullets = []; // {x,y,v,owner}
let aliens = [];
const rows = 4, cols = 8;
const alienStartX = 12, alienStartY = 12, alienSpacingX = 16, alienSpacingY = 14;
let alienDir = 1; // 1 right, -1 left
let alienSpeed = 6; // px/sec lateral (reducido para descender más lento)
let alienAnimTime = 0;
let alienAnimFrame = 0;
let gameOver = false;
let lastResult = null; // 'win' o 'lose'
let score = 0;

function createAliens(){
    aliens = [];
    for (let r=0;r<rows;r++){
        for (let c=0;c<cols;c++){
            aliens.push({
                x: alienStartX + c*alienSpacingX,
                y: alienStartY + r*alienSpacingY,
                w: alienFrames[0][0].length,
                h: alienFrames[0].length,
                alive: true
            });
        }
    }
}
createAliens();

// Input: left/right arrows or A/D, shoot: space
function tryShoot(){
    const now = performance.now();
    if (now - player.lastShot >= 1000){ // 1 second cooldown
        player.lastShot = now;
        bullets.push({x: player.x + Math.floor(player.w/2), y: player.y, v: -120, owner: 'player'});
    }
}

// Overlay control
function showOverlay(result){
    lastResult = result;
    overlayTitle.textContent = result === 'win' ? '¡Has ganado!' : 'Has perdido';
    overlayBox.style.display = 'block';
    restartBtn.focus();
}

function hideOverlay(){
    overlayBox.style.display = 'none';
}

// Reset / reiniciar partida
function resetGame(){
    // reset player
    player.x = logicalW/2 - 3;
    player.y = logicalH - 12;
    player.lastShot = -9999;
    // reset bullets and aliens
    bullets = [];
    createAliens();
    alienDir = 1;
    alienSpeed = 6;
    alienAnimTime = 0;
    alienAnimFrame = 0;
    gameOver = false;
    lastResult = null;
    score = 0;
    hideOverlay();
    last = performance.now();
    requestAnimationFrame(update);
}

restartBtn.addEventListener('click', resetGame);

// Update loop
let last = performance.now();
function update() {
    const now = performance.now();
    const dt = (now - last) / 1000;
    last = now;
    if (gameOver) return;
    // player movement
    let dir = 0;
    if (keys['arrowleft'] || keys['a']) dir -= 1;
    if (keys['arrowright'] || keys['d']) dir += 1;
    player.x += dir * player.speed * dt;
    player.x = Math.max(0, Math.min(logicalW - player.w, player.x));

    if ((keys[' '] || keys['spacebar'] || keys['space'])) tryShoot();

    // bullets
    for (let i = bullets.length-1; i>=0; i--){
        const b = bullets[i];
        b.y += b.v * dt;
        // collision with aliens (only player's bullets)
        if (b.owner === 'player'){
            for (let j=0;j<aliens.length;j++){
                const a = aliens[j];
                if (!a.alive) continue;
                if (b.x >= a.x && b.x <= a.x + a.w && b.y >= a.y && b.y <= a.y + a.h){
                    a.alive = false;
                    bullets.splice(i,1);
                    score += 100;
                    break;
                }
            }
        }
        if (b.y < -10 || b.y > logicalH+10) bullets.splice(i,1);
    }

    // alien animation & movement
    alienAnimTime += dt;
    if (alienAnimTime > 0.3){
        alienAnimTime = 0;
        alienAnimFrame = (alienAnimFrame + 1) % alienFrames.length;
    }

    // Move aliens sideways, if any alive reach edge, flip and move down 
    let moveX = alienDir * alienSpeed * dt;
    let willHit = false;
    for (const a of aliens){
        if (!a.alive) continue;
        if (a.x + moveX < 0 || a.x + a.w + moveX > logicalW) { willHit = true; break; }
    }
    if (willHit){
        alienDir *= -1;
        for (const a of aliens) a.y += 3; // menor bajada para que desciendan más lento (antes 8)
        // increase speed slightly (más pequeño incremento)
        alienSpeed += 0.05;
    } else {
        for (const a of aliens) a.x += moveX;
    }

    // simple alien shooting (random)
    // occasionally shoot from a random live alien
    if (Math.random() < 0.01){
        const live = aliens.filter(a=>a.alive);
        if (live.length){
            const shooter = live[Math.floor(Math.random()*live.length)];
            bullets.push({x: shooter.x + Math.floor(shooter.w/2), y: shooter.y + shooter.h, v: 70, owner: 'alien'});
        }
    }

    // alien bullets hit player
    for (let i=bullets.length-1;i>=0;i--){
        const b = bullets[i];
        if (b.owner === 'alien'){
            if (b.x >= player.x && b.x <= player.x + player.w && b.y >= player.y && b.y <= player.y + player.h){
                gameOver = true;
                showOverlay('lose');
                break;
            }
        }
    }

    // check aliens reach bottom
    for (const a of aliens){
        if (!a.alive) continue;
        if (a.y + a.h >= player.y){
            gameOver = true;
            showOverlay('lose');
            break;
        }
    }

    // win?
    if (!gameOver && aliens.every(a=>!a.alive)){
        gameOver = true;
        showOverlay('win');
    }

    // render
    render();
    if (!gameOver) requestAnimationFrame(update);
}

// render logical canvas then scale to screen
function render(){
    // clear
    L.fillStyle = '#001';
    L.fillRect(0,0,logicalW,logicalH);

    // draw aliens
    for (const a of aliens){
        if (!a.alive) continue;
        const frame = alienFrames[alienAnimFrame];
        drawPixelSprite(L, frame, Math.floor(a.x), Math.floor(a.y), 1);
    }

    // draw bullets
    for (const b of bullets){
        if (b.owner === 'player') L.fillStyle = '#ff0'; else L.fillStyle = '#f88';
        L.fillRect(Math.floor(b.x)-1, Math.floor(b.y)-2, 2, 4);
    }

    // draw player
    drawPixelSprite(L, shipSprite, Math.floor(player.x), Math.floor(player.y), 1);

    // blit to main canvas with integer scaling
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(lCanvas, 0,0, logicalW, logicalH, 0,0, logicalW*scale, logicalH*scale);

    // HUD
    hud.textContent = `Puntos: ${score}  |  Disparo: 1s  ${gameOver?"| FIN":" "}`;
}

render();
requestAnimationFrame(update);
</script>
</body>
</html>
